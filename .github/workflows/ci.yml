name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Secret scan
        run: |
          if git grep -n -I -E 'BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|0x[0-9a-fA-F]{64}' -- . ':(exclude)test/**' ':(exclude)RUNBOOK_PILOTO.md'; then
            echo "Potential secret material found in tracked non-fixture files."
            exit 1
          fi

      - name: Integration regression tests
        run: npm test -- --run test/storage.test.ts test/live-adapter.test.ts test/exit-reservation.test.ts test/session.test.ts
